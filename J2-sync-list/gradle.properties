# Без этого на Windows сам Gradle (не только наша программа) может читать и печатать
# вывод дочернего процесса не в UTF-8 — тогда кириллица ломается ещё до того, как долетит
# до консоли, независимо от того, что делает наш код в Main.main(). См. README, раздел
# "Кириллица в консоли на Windows".
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8

# runCustom/runSync читают ввод построчно в интерактивном режиме. "Богатая" консоль Gradle
# по умолчанию периодически перерисовывает строку со своим прогресс-баром (те самые
# "75% EXECUTING [Ns]") поверх того, что уже напечатано — включая строку, где ты только что
# вводил текст. plain отключает эту перерисовку: обычный построчный вывод без прогресс-бара.
org.gradle.console=plain
